[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-llm"
version = "0.1.0"
description = "Personal professional-domain LLM repository optimized for Apple Silicon with LoRA, RAG, and domain restriction."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Codex" }
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "chromadb>=0.5.11",
  "datasketch>=1.6.5",
  "fastapi>=0.115.0",
  "google-api-python-client>=2.149.0",
  "google-auth>=2.35.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.1",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "markdownify>=0.13.1",
  "numpy>=1.26.4",
  "openpyxl>=3.1.5",
  "orjson>=3.10.7",
  "pandas>=2.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "pypdf>=5.0.1",
  "pyarrow>=17.0.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0.2",
  "qdrant-client>=1.11.3",
  "rich>=13.9.2",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.31.0",
]

[project.optional-dependencies]
local = [
  "mlx>=0.20.0; platform_system == 'Darwin'",
  "mlx-lm>=0.20.2; platform_system == 'Darwin'",
]
remote = [
  "axolotl>=0.6.0",
  "peft>=0.13.2",
  "transformers>=4.45.2",
]
serving = [
  "llama-cpp-python>=0.3.2",
  "ollama>=0.3.3",
]
dev = [
  "mypy>=1.11.2",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.5.39",
  "pymdown-extensions>=10.14.2",
  "pre-commit>=4.0.1",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.5.39",
  "pymdown-extensions>=10.14.2",
]

[project.scripts]
personal-llm = "personal_llm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "S", "A", "C4", "T20"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = []

# Third-party libraries below ship no inline types and no stub package on PyPI;
# ignore_missing_imports is mypy's documented way to handle that, scoped per module
# rather than relaxing strict mode globally.
[[tool.mypy.overrides]]
module = [
  "datasketch",
  "google_auth_oauthlib.*",
  "googleapiclient.*",
  "mlx_lm",
  "llama_cpp",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "types-pyyaml>=6.0.12.20260906",
]
