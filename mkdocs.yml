site_name: personal-llm
site_description: Personal professional-domain LLM repository optimized for Apple Silicon with LoRA, RAG, and domain restriction.
docs_dir: site-docs
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - docs/assets/site.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - docs/assets/mermaid-init.js

exclude_docs: |
  .git/
  .github/
  .venv/
  .uv-cache/
  .mypy_cache/
  .pytest_cache/
  .ruff_cache/
  __pycache__/
  build/
  dist/
  site/
  tests/fixtures/**/*.mbox
  tests/fixtures/**/*.csv
  tests/fixtures/**/*.json
  data/raw/**
  data/processed/**
  adapters/output/**
  models/cache/**
  secrets/**

