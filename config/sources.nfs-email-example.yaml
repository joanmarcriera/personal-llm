defaults:
  raw_dir: data/raw
  processed_dir: data/processed
  recurse: true
  include_extensions:
    - .md
    - .markdown
    - .txt
    - .pdf
    - .docx
    - .html
    - .htm
    - .eml
    - .mbox
    - .xlsx
    - .csv
connectors:
  local_files:
    enabled: true
    paths:
      - /Volumes/KnowledgeShare
      - /Volumes/KnowledgeShare/notes
      - /Volumes/KnowledgeShare/architecture
      - /Volumes/KnowledgeShare/email/eml-export
  code_repositories:
    enabled: true
    paths:
      - /Volumes/KnowledgeShare/code
  google_drive:
    enabled: false
    root_folder_id: null
  email:
    enabled: true
    mbox_paths:
      - /Volumes/KnowledgeShare/email/archive.mbox
    gmail_takeout_paths: []
    imap:
      enabled: false
      folder: INBOX
  linkwarden:
    enabled: true
    export_path: /Volumes/KnowledgeShare/linkwarden/export.json
